appId: com.lardermind.app
tags:
  - guest
---
# Guest trial: "Try without an account" opens the app with no sign-up, and the drawer works.
- clearState
- stopApp
- runFlow:
    file: subflows/guest-session.yaml
# The chat loads its history first; wait for the empty state instead of asserting immediately.
- takeScreenshot: maestro-out/guest-after-login
- extendedWaitUntil:
    visible:
      id: "chat-empty-state"
    timeout: 30000
- tapOn:
    id: "header-menu"
- assertVisible:
    id: "drawer-settings"
- tapOn:
    id: "drawer-settings"
- extendedWaitUntil:
    visible: "Settings"
    timeout: 10000
