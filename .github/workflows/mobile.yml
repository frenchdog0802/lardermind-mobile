name: Mobile

on:
  push:
    branches: [master, main, 'feat/**']
  pull_request:
  workflow_dispatch:
    inputs:
      include_new_backend_flows:
        description: 'Also run flows that need the new backend (delete-account)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

env:
  # E2E builds talk to staging. Not secrets: the API base URL and the public Google web client id.
  EXPO_PUBLIC_API_BASE_URL: https://lardermind-api-staging.lardermind.workers.dev/api/
  EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: 603047692060-llk1cjf1b0f5bpdb9it5cvogk2b8haio.apps.googleusercontent.com

jobs:
  verify:
    name: Typecheck + unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run verify:strict

  e2e-android:
    name: Maestro E2E (Android emulator)
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: npm ci

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('package-lock.json', 'app.json') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Build release APK (embedded JS bundle, x86_64 only)
        working-directory: android
        run: ./gradlew :app:assembleRelease -PreactNativeArchitectures=x86_64 --no-daemon

      - name: Verify the JS bundle is embedded
        run: node scripts/verify-embedded-bundle.js android/app/build/outputs/apk/release/app-release.apk

      - name: Install Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | MAESTRO_VERSION=2.8.0 bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Maestro flows
        uses: reactivecircus/android-emulator-runner@v2
        env:
          E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
          E2E_EXCLUDE_TAGS: ${{ inputs.include_new_backend_flows && ' ' || 'needs-new-backend' }}
        with:
          api-level: 34
          # AOSP image: no Pixel Launcher / Google services, which hang ("isn't responding") on CI and cover the app.
          target: default
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          heap-size: 576M
          disable-animations: true
          emulator-options: -no-window -no-snapshot -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: bash scripts/ci-e2e.sh

      - name: Upload Maestro report and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-out
          path: maestro-out
          if-no-files-found: ignore
