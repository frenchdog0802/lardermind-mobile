appId: com.lardermind.app
tags:
  - guest
---
# Forgot-password screens are reachable from login and validate input on the device (no network needed).
- clearState
- stopApp
- runFlow:
    file: subflows/connect-dev-server.yaml
- tapOn:
    id: "login-forgot-password"
- extendedWaitUntil:
    visible:
      id: "forgot-email"
    timeout: 15000
- tapOn:
    id: "forgot-have-code"
- extendedWaitUntil:
    visible:
      id: "reset-token"
    timeout: 15000
# Empty form must be rejected on the device, not sent to the server.
- tapOn:
    id: "reset-submit"
- assertVisible:
    id: "reset-error"
- tapOn:
    id: "reset-back"
- extendedWaitUntil:
    visible:
      id: "login-email"
    timeout: 15000
